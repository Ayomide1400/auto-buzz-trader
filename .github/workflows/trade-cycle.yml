name: Trade Cycle

# Note: GitHub occasionally stops firing a repo's scheduled runs silently
# (state stays "active" via the API, it just doesn't trigger) — observed
# here after ~3 days of low repo activity. A commit to this file is a
# known practical way to make GitHub re-register the schedule. If runs
# go quiet again, check `gh run list --workflow=trade-cycle.yml` and
# re-trigger manually with `gh workflow run trade-cycle.yml` rather than
# assuming the strategy simply found nothing to do.
on:
  schedule:
    # Every 15 minutes, 13:00-21:00 UTC, Mon-Fri — covers US market hours
    # (9:30am-4pm ET) across both EST and EDT. The endpoint itself no-ops
    # when the market is closed or auto-trading is paused, so it's safe
    # to trigger on a schedule wider than actual market hours.
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger trade cycle
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://auto-buzz-trader.vercel.app/api/cron/trade-cycle
